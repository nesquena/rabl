name: Ruby tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Ruby tests
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        ruby-version: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        channel: ['stable']
        os: ['ubuntu-latest']

        include:
          - ruby-version: 'head'
            channel: 'experimental'
            os: 'ubuntu-latest'

    continue-on-error: ${{ matrix.channel != 'stable' }}

    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Enable frozen string flags in RUBYOPT (Ruby >= 3.0)
      if: ${{ !(startsWith(matrix.ruby-version, '1.') || startsWith(matrix.ruby-version, '2.') ) }}
      run: |
        echo "RUBYOPT=--enable=frozen-string-literal --debug=frozen-string-literal" >> $GITHUB_ENV
    - name: Run tests
      run: bundle exec rake

  apps:
    # Generates fresh Rails and Sinatra apps that use rabl from this checkout, and runs their
    # tests (test/apps)
    name: ${{ matrix.app }} app
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: rails-7.2
            ruby-version: '3.1'
          - app: rails-8.1
            ruby-version: '3.4'
          - app: sinatra
            ruby-version: '3.4'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
    - name: Install Rails
      if: startsWith(matrix.app, 'rails-')
      env:
        APP: ${{ matrix.app }}
      run: gem install rails -v "~> ${APP#rails-}.0" --no-document
    - name: Generate the app and run its tests
      env:
        APP: ${{ matrix.app }}
      run: test/apps/build_and_test.sh "$APP" "$RUNNER_TEMP/app"
