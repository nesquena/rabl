# Creates the GitHub release page for a tag that already exists, with GitHub's generated notes (merged
# PRs and new contributors since the previous release) after a link to CHANGELOG.md as of that tag (the
# default branch's for an old tag that has none).
# release.yml runs it after it publishes; "Run workflow" here (with the tag) creates the page for an
# earlier release. A tag that already has a release is left alone, so running it twice is harmless.
# A tag that isn't the newest vX.Y.Z tag is created with --latest=false; the API otherwise marks every
# new release as Latest.

name: github-release
run-name: github release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag, e.g. v1.2.0'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-page:
    if: github.repository == 'nesquena/rabl'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the release
    steps:
      - name: Create the GitHub release
        shell: bash -eo pipefail {0}
        env:
          TAG: ${{ inputs.tag }}
          CHANGELOG: CHANGELOG.md
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a tag like v1.2.3"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a release; leaving it alone"
            exit 0
          fi
          # Compare with the newest vX.Y.Z tag rather than the "Latest" release, so a failed lookup stops the
          # step (pipefail) instead of letting an older tag become Latest
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' |
            sed -nE 's#^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$#\1#p' | sort -V | tail -n 1) ||
            { echo "::error::could not list the repository's tags"; exit 1; }
          [ -n "$newest" ] || { echo "::error::found no vX.Y.Z tag (is $TAG pushed?)"; exit 1; }
          flags=()
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest tag ($newest): not marking it as latest"
            flags=(--latest=false)
          fi
          # Link the changelog as of the tag, or the default branch's for an old tag without one. Any error
          # but a 404 stops the step.
          ref=$TAG
          if ! err=$(gh api "repos/$GITHUB_REPOSITORY/contents/$CHANGELOG?ref=$TAG" --silent 2>&1 >/dev/null); then
            [[ "$err" == *"HTTP 404"* ]] || { echo "::error::could not look up $CHANGELOG at $TAG: $err"; exit 1; }
            echo "$TAG has no $CHANGELOG; linking the default branch's"
            ref=HEAD
          fi
          # --verify-tag: refuse rather than create the tag. With --generate-notes, GitHub puts these notes
          # before the generated ones.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${flags[@]}" \
            --notes "What changed, and what to do when upgrading: [$CHANGELOG](https://github.com/$GITHUB_REPOSITORY/blob/$ref/$CHANGELOG)."
